# ---------------------------------------------------------------------------
# Apache Iceberg 1.12.0 on Apache Spark 4.2.0 (Scala 2.13)
#
# SNAPSHOT, and deliberately so: Iceberg 1.12.0 publishes runtimes only for
# Spark 3.5 / 4.0 / 4.1, and the 4.1 runtime cannot be loaded by Spark 4.2 at
# all. Spark 4.2 turned connector.catalog.View from an interface into a class,
# so the released jar dies with IncompatibleClassChangeError on SparkView.
# Iceberg 1.12.0's source tree does contain a working spark/v4.2 module; only
# the 1.12.0-SNAPSHOT builds published it.
#
# The two artifacts MUST come from the same build. Iceberg 1.12.0's release cut
# also moved HttpClientProperties from Apache HttpClient 4 to 5, so the released
# iceberg-aws-bundle:1.12.0 (HttpClient 5) does not match the last published
# 4.2 runtime snapshot (HttpClient 4) and fails with
# NoClassDefFoundError: .../http/apache/ApacheHttpClient$Builder.
#
# To use released jars instead, drop to Spark 4.1.3 (see the README) and switch
# both coordinates to iceberg-spark-runtime-4.1_2.13:1.12.0 and
# iceberg-aws-bundle:1.12.0, then drop spark.jars.ivySettings.
#
# iceberg-aws-bundle must be listed explicitly: since Iceberg 1.3 the AWS SDK v2
# is no longer shaded into iceberg-spark-runtime, and both artifact POMs declare
# no dependencies, so spark.jars.packages will not pull it in transitively.
# Without it S3FileIO fails with NoClassDefFoundError.
# ---------------------------------------------------------------------------
spark.jars.packages                          org.apache.iceberg:iceberg-spark-runtime-4.2_2.13:1.12.0-SNAPSHOT,org.apache.iceberg:iceberg-aws-bundle:1.12.0-SNAPSHOT,org.postgresql:postgresql:42.7.13
spark.jars.ivySettings                       file:///opt/spark/conf/ivysettings.xml

spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# ---------------------------------------------------------------------------
# my_catalog - JDBC catalog in Postgres, data + metadata files in SeaweedFS S3
# ---------------------------------------------------------------------------
spark.sql.catalog.my_catalog                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.my_catalog.catalog-impl    org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.my_catalog.uri             jdbc:postgresql://db:5432/icebergcat
spark.sql.catalog.my_catalog.jdbc.user       icebergcat
spark.sql.catalog.my_catalog.jdbc.password   iceberg
spark.sql.catalog.my_catalog.warehouse       s3://iceberg

# New in Iceberg 1.12.0: the JDBC catalog grew view support. Without this the
# catalog refuses every operation with "JDBC catalog is initialized without view
# support"; V1 auto-migrates the Postgres schema on startup.
spark.sql.catalog.my_catalog.jdbc.schema-version V1

spark.sql.catalog.my_catalog.io-impl                    org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.my_catalog.s3.endpoint                http://seaweedfs:8333
spark.sql.catalog.my_catalog.s3.region                  us-east-1
spark.sql.catalog.my_catalog.s3.access-key-id            icebergadmin
spark.sql.catalog.my_catalog.s3.secret-access-key        icebergadmin
spark.sql.catalog.my_catalog.s3.path-style-access        true

# ---------------------------------------------------------------------------
# seaweed_catalog - the Iceberg REST catalog that SeaweedFS serves natively on
# :8181. SeaweedFS serves unprefixed /v1/... paths and picks which table bucket
# backs the catalog from the `warehouse` property, because each S3 Tables
# bucket is a separate catalog. So the URI stays bare.
# ---------------------------------------------------------------------------
spark.sql.catalog.seaweed_catalog                            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.seaweed_catalog.type                       rest
spark.sql.catalog.seaweed_catalog.uri                        http://seaweedfs:8181
spark.sql.catalog.seaweed_catalog.warehouse                  s3://iceberg-catalog
spark.sql.catalog.seaweed_catalog.io-impl                    org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.seaweed_catalog.s3.endpoint                http://seaweedfs:8333
spark.sql.catalog.seaweed_catalog.s3.region                  us-east-1
spark.sql.catalog.seaweed_catalog.s3.access-key-id            icebergadmin
spark.sql.catalog.seaweed_catalog.s3.secret-access-key        icebergadmin
spark.sql.catalog.seaweed_catalog.s3.path-style-access        true
spark.sql.catalog.seaweed_catalog.rest.sigv4-enabled          true
spark.sql.catalog.seaweed_catalog.rest.signing-name           s3
spark.sql.catalog.seaweed_catalog.rest.access-key-id          icebergadmin
spark.sql.catalog.seaweed_catalog.rest.secret-access-key      icebergadmin

spark.sql.catalog.spark_catalog              org.apache.iceberg.spark.SparkSessionCatalog
spark.sql.defaultCatalog                     my_catalog
spark.sql.catalogImplementation              in-memory

# ---------------------------------------------------------------------------
# Event log / history server
# ---------------------------------------------------------------------------
spark.eventLog.enabled                       true
spark.eventLog.dir                           /home/spark/spark-events
spark.history.fs.logDirectory                /home/spark/spark-events
spark.ui.port                               4040
spark.local.dir                             /home/spark/spark-local
spark.sql.shuffle.partitions                 8
